[sources.docker]
type = "docker_logs"
include_labels = ["com.scanreplay.platform=scanreplay"]

[transforms.normalize]
type = "remap"
inputs = ["docker"]
source = '''
.platform = "scanreplay"
.environment = "local"
.service = .label."com.scanreplay.service"
'''

[sinks.loki]
type = "loki"
inputs = ["normalize"]
endpoint = "http://loki:3100"
encoding.codec = "json"
labels.platform = "scanreplay"
labels.environment = "{{ environment }}"
labels.service = "{{ service }}"
